<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>My Certificates</h1>
            <p>Training, Certifications, and Achievements</p>
        </div>
    </header>

    <div class="container">

        <div class="certificate-grid">

            <div class="certificate-card">
                <img src="ds.jpg" alt="Data Science Certificate">

                <div class="certificate-info">
                    <h3>Certificate for Data Science</h3>
                    <p>Cisco Networking Academy • 2025</p>
                </div>
            </div>

            <div class="certificate-card">
                <img src="fluency.jpg" alt="AI Fluency Certificate">

                <div class="certificate-info">
                    <h3>AI Fluency: Frameworks & Foundations</h3>
                    <p>ANTHROP\C • 2026</p>
                </div>
            </div>

            <div class="certificate-card">
                <img src="ojt.jpg" alt="On-The Job Training Certificate">

                <div class="certificate-info">
                    <h3>On-The Job Training Certificate</h3>
                    <p>Municipality of Agoo • 2026</p>
                </div>
            </div>

        </div>

        <div class="back-btn">
            <a href="index.html">← Back to Portfolio</a>
        </div>

    </div>

</body>
</html>
